name: NEO VIDEO GEN CI

on:
  # Deliberately manual: do not enqueue a full CI run for every small commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-video-gen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app.py neo_video_gen scripts tests
      - name: Run unit tests
        run: pytest -q
