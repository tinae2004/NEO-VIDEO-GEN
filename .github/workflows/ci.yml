name: NEO VIDEO GEN CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-video-gen-ci
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q app.py neo_video_gen tests
      - name: Test
        run: pytest -q
